services:
  - type: web
    name: wfm-planning-scheduling
    env: python
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: "pip install -r requirements.txt"
    # alembic upgrade head tourne a chaque deploiement, avant de demarrer le
    # serveur : necessaire car le plan free de Render n'offre pas d'acces
    # shell pour lancer les migrations a la main. Idempotent (aucun effet
    # si la base est deja a jour), donc sans danger sur les redeploiements.
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false # URL de connexion Supabase, à définir manuellement dans Render
      - key: SECRET_KEY
        generateValue: true
      - key: DAILY_HOURS
        value: "8"
      - key: WEEKLY_HOURS
        value: "40"
      - key: WORKING_DAYS
        value: "5"
      - key: INTERVAL_MINUTES
        value: "30"
      # Optionnel : si les deux sont renseignés ET qu'aucun compte n'existe
      # encore avec cet email, un compte admin est créé automatiquement au
      # démarrage (voir app/main.py bootstrap_admin_if_configured) — pensé
      # pour un plan Render sans accès shell. Le secret TOTP s'affiche dans
      # les logs Render (Dashboard > Logs), pas besoin de terminal.
      # Peuvent être retirés une fois le compte créé.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # OTP email : pour Gmail/Google Workspace, utilisez un mot de passe d'application
      # plutôt que le mot de passe principal du compte.
      - key: OTP_DELIVERY_MODE
        value: "email"
      - key: EMAIL_PROVIDER
        value: "brevo"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        value: "WFM Planning & Scheduling"
      - key: EMAIL_OTP_TTL_SECONDS
        value: "600"
      - key: EMAIL_OTP_RESEND_COOLDOWN_SECONDS
        value: "60"
      - key: EMAIL_OTP_MAX_ATTEMPTS
        value: "5"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "WFM Planning & Scheduling"
      - key: SMTP_USE_TLS
        value: "true"
      # Optionnel : "true" cree une campagne + skill de demo au demarrage
      # si aucune campagne n'existe encore (voir bootstrap_demo_data_if_configured
      # dans app/main.py) - meme logique que le bootstrap admin ci-dessus.
      - key: BOOTSTRAP_DEMO_DATA
        sync: false
