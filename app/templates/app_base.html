<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WFM Planning & Scheduling{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/app.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar__brand">WFM Planning &amp; Scheduling</div>
        <nav class="sidebar__nav">
            <a class="sidebar__link{% if active_nav == 'ltf' %} sidebar__link--active{% endif %}" href="/ltf">LTF Monthly</a>
            <a class="sidebar__link{% if active_nav == 'stf' %} sidebar__link--active{% endif %}" href="/stf">STF Weekly</a>
            <a class="sidebar__link{% if active_nav == 'daily' %} sidebar__link--active{% endif %}" href="/daily">Daily / Intraday</a>
            <a class="sidebar__link{% if active_nav == 'capacity' %} sidebar__link--active{% endif %}" href="/capacity">Capacity Planning</a>
            <a class="sidebar__link{% if active_nav == 'shrinkage' %} sidebar__link--active{% endif %}" href="/shrinkage">Shrinkage</a>
        </nav>
        <div class="sidebar__footer">
            {% if current_user %}
            <div class="sidebar__user">
                <strong>{{ current_user.email }}</strong>
                {{ current_user.role.value }}
            </div>
            <form method="post" action="/logout">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button type="submit" class="btn-logout">Se déconnecter</button>
            </form>
            {% endif %}
        </div>
    </aside>
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
